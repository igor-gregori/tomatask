name: GitHub Pages redirect

# O endereço antigo (igor-gregori.github.io/tomatask) só redireciona para tomatask.igreg.dev.
on:
  push:
    branches: [main]
    paths: [github-pages/**, .github/workflows/github-pages-redirect.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A mesma página atende qualquer caminho antigo, via 404.html.
      - run: cp github-pages/index.html github-pages/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
